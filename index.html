const NAV=[["home","Home"],["women","Women’s Collection"],["men","Men’s Collection"],["shawls","Shawls"],["new","New Arrivals"],["contact","Contact"]];
const $=s=>document.querySelector(s),pkr=n=>"PKR "+n.toLocaleString("en-PK");
let cart=[],opt={},qty=1,filt="All";
/* placeholder garment artwork — swap for photography via img in P */
function art(p,v){if(p.img&&v!=="swatch")return `<img src="${(p.gallery&&p.gallery[v])||p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">`;
const c=p.c,d=p.bg,vb=v===1?"90 70 120 110":v===2?"60 220 180 160":"0 0 300 400";let g="";
if(p.kind==="suit")g=`<path d="M100 250l25 120h23l2-110h4l2 110h23l25-120z" fill="${c}" opacity=".78"/><path d="M104 92l32-12q14 14 28 0l32 12 8 160H96z" fill="${c}"/><path d="M104 92L68 205l20 6 24-72zM196 92l36 113-20 6-24-72z" fill="${c}"/><path d="M96 238h108M136 80q14 20 28 0" stroke="${GOLD}" stroke-width="2" fill="none"/><path d="M98 246h104" stroke="${GOLD}" stroke-width="1" stroke-dasharray="3 3"/><path d="M110 88q40 40 80 0" stroke="${GOLD}" stroke-width="1" fill="none"/>`;
else if(p.kind==="fabric")g=`<rect x="60" y="250" width="180" height="40" rx="3" fill="${c}"/><rect x="70" y="205" width="170" height="40" rx="3" fill="${c}" opacity=".85"/><rect x="55" y="160" width="185" height="40" rx="3" fill="${c}" opacity=".7"/><path d="M60 270h180M70 225h170M55 180h185" stroke="${GOLD}" stroke-width="1.5"/><rect x="95" y="90" width="110" height="64" rx="32" fill="${c}"/><path d="M95 122h110" stroke="${GOLD}" stroke-width="1.5"/>`;
else g=`<path d="M85 70q65-28 130 0l16 250H69z" fill="${c}"/><path d="M85 70q65 30 130 0" stroke="${GOLD}" stroke-width="2" fill="none"/><path d="M80 290h140M82 250h136" stroke="${GOLD}" stroke-width="1.5" opacity=".9"/><path d="M69 320v36M81 320v36M93 320v36M105 320v36M117 320v36M129 320v36M141 320v36M153 320v36M165 320v36M177 320v36M189 320v36M201 320v36M213 320v36M225 320v36" stroke="${c}" stroke-width="2"/>`;
return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${p.name} (placeholder image)"><defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${CREAM}" stop-opacity=".18"/><stop offset=".55" stop-color="${CREAM}" stop-opacity="0"/><stop offset="1" stop-color="${CHAR}" stop-opacity=".28"/></linearGradient></defs><rect x="0" y="0" width="300" height="400" fill="${d}"/>${g}<rect width="300" height="400" fill="url(#vg)"/></svg>`}
const card=p=>`<a class="pc" href="#p-${p.id}"><div class="im">${art(p)}${p.isNew?'<span class="tg">NEW</span>':""}<div class="qv">QUICK VIEW</div></div><h3>${p.name}</h3><div class="pr">${pkr(p.price)}</div></a>`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1800)}
function menu(o){$("#menu").classList.toggle("open",!!o)}
function srch(o){$("#srch").classList.toggle("open",!!o);if(o){$("#sq").focus();sres()}}
function sres(){const q=$("#sq").value.toLowerCase();$("#sr").innerHTML=P.filter(p=>(p.name+p.col+p.fabric).toLowerCase().includes(q)).map(p=>`<a href="#p-${p.id}" onclick="srch(0)"><span>${p.name}</span><span>${pkr(p.price)}</span></a>`).join("")||"<p style='padding:14px 0'>No matches. Try “silk”, “wool” or “lawn”.</p>"}
const sub=()=>cart.reduce((s,i)=>s+i.p.price*i.q,0),dlv=()=>!cart.length||sub()>=CFG.freeOver?0:CFG.deliveryFee;
function add(id){const p=P.find(x=>x.id===id),o=opt[id]||(p.opts.length===1?p.opts[0]:null);if(!o){toast("Please select an option");return}
const f=cart.find(i=>i.p.id===id&&i.o===o);f?f.q+=qty:cart.push({p,o,q:qty});upd();toast("Added to your bag")}
function chg(k,d){const i=cart[k];i.q=Math.max(1,i.q+d);upd();route()}function rem(k){cart.splice(k,1);upd();route()}
function upd(){$("#cnt").textContent=cart.reduce((s,i)=>s+i.q,0)}
function pick(id,o){opt[id]=o;route()}function setq(d){qty=Math.max(1,qty+d);route()}
function home(){const a=P.filter(p=>p.isNew).slice(0,4);return `<section class="hero"><div class="hp"><img class="hl" src="${LOGO}" alt="RIVAYAT by QASH. An expression of timeless elegance."></div><div class="hb"><p>Formal wear, fine fabrics and heritage shawls, made to be kept.</p><a class="btn" href="#women">Explore Collection</a></div></section>
<section class="s"><div class="wrap"><div class="sh"><h2>The Collections</h2><p>CRAFTED FOR EVERY OCCASION</p></div><div class="col3">${[["women",P[1],"Women’s Stitched"],["men",P[6],"Men’s Unstitched"],["shawls",P[9],"Shawls"]].map(x=>`<a class="cc" href="#${x[0]}">${art(x[1])}<div class="cap"><h3>${x[2]}</h3><span>VIEW COLLECTION</span></div></a>`).join("")}</div></div></section>
<section class="s" style="padding-top:0"><div class="wrap"><div class="sh"><h2>New Arrivals</h2></div><div class="grid">${a.map(card).join("")}</div><p style="text-align:center;margin-top:40px"><a class="btn" href="#new">View all</a></p></div></section>
<section class="s" style="padding-bottom:0"><div class="wrap"><div class="sh"><h2>The House of Rivayat</h2><p>HERITAGE, CRAFT, FABRIC</p></div><div class="pillars"><div><h3>Heritage</h3><p>Silhouettes and motifs drawn from the subcontinent’s textile traditions, reinterpreted for today.</p></div><div><h3>Craft</h3><p>Borders, necklines and hems finished by hand, in small batches.</p></div><div><h3>Fabric</h3><p>Lawn, raw silk, khaddar, merino and fine wool, chosen for how they feel and fall.</p></div></div><div class="svc"><span>Cash on delivery nationwide</span><span>Easy exchange</span><span>Complimentary delivery above ${pkr(CFG.freeOver)}</span></div></div></section>
<section class="s story"><div class="wrap"><div class="rule"></div><h2>A LEGACY WOVEN IN EVERY THREAD.</h2><p>Rivayat means tradition: the stories, skills and standards passed from one generation to the next.</p><p>Each piece begins with fabric chosen for its hand and drape, and is finished by artisans who treat embroidery as an inheritance, not a trend.</p><p>We design for people who dress with intention, and for wardrobes that last.</p></div></section>`}
function coll(k){const t=COLS[k];let L=k==="new"?P.filter(p=>p.isNew):P.filter(p=>p.col===k);const subs=["All",...new Set(L.map(p=>p.sub))];if(!subs.includes(filt))filt="All";if(filt!=="All")L=L.filter(p=>p.sub===filt);
return `<div class="page wrap"><div class="sh"><div class="crumb">COLLECTION</div><h2>${t[0]}</h2><p>${t[1].toUpperCase()}</p></div>${k==="new"?"":`<div class="chips">${subs.map(s=>`<button class="chip ${s===filt?"on":""}" onclick="filt='${s}';route()">${s}</button>`).join("")}</div>`}<div class="grid">${L.map(card).join("")}</div></div>`}
let gv=0;
function prod(id){const p=P.find(x=>x.id===id);if(!p)return "<div class='page wrap'>Product not found.</div>";const rel=P.filter(x=>x.col===p.col&&x.id!==id).slice(0,4);
return `<div class="page wrap"><div class="crumb"><a href="#${p.col}">${COLS[p.col][0].toUpperCase()}</a></div><div class="pd"><div class="gal"><div class="main">${art(p,gv)}</div><div class="th">${[0,1,2].map(i=>`<button class="${gv===i?"on":""}" onclick="gv=${i};route()" aria-label="View ${i+1}">${art(p,i)}</button>`).join("")}</div></div>
<div><h1>${p.name}</h1><div class="price">${pkr(p.price)}</div><p>${p.desc}</p><div style="margin-top:22px" class="lbl">${p.opts===W?"Size":p.opts===M?"Length":"Size"}</div><div class="opts">${p.opts.map(o=>`<button class="opt ${(opt[id]||(p.opts.length===1&&o))===o?"on":""}" onclick="pick('${id}','${o}')">${o}</button>`).join("")}</div>
<div class="lbl">Quantity</div><div class="qty"><button onclick="setq(-1)" aria-label="Less">−</button><span>${qty}</span><button onclick="setq(1)" aria-label="More">+</button></div><button class="btn full" onclick="add('${id}')">Add to Cart</button>
<div class="det"><div><b>Fabric</b>${p.fabric}</div><div><b>Details</b>${p.det}</div><div><b>Delivery</b>Cash on delivery across Pakistan. Exchange within 7 days (placeholder policy).</div></div></div></div>
<div class="sh" style="margin-top:80px"><h2>You may also like</h2></div><div class="grid">${rel.map(card).join("")}</div></div>`}
function cartv(){if(!cart.length)return `<div class="page wrap sh"><h2>Your bag is empty</h2><p style="margin:14px 0 24px;color:inherit">Explore the collections to begin.</p><a class="btn" href="#women">Explore Collection</a></div>`;
return `<div class="page wrap"><div class="sh"><h2>Shopping Bag</h2></div><div class="cl"><div>${cart.map((i,k)=>`<div class="row"><a class="t" href="#p-${i.p.id}">${art(i.p)}</a><div><h3>${i.p.name}</h3><small>${i.o}</small><div>${pkr(i.p.price)}</div><div class="a"><div class="qty"><button onclick="chg(${k},-1)" aria-label="Less">−</button><span>${i.q}</span><button onclick="chg(${k},1)" aria-label="More">+</button></div><button class="rm" onclick="rem(${k})">Remove</button></div></div></div>`).join("")}</div>${sum()}</div></div>`}
function sum(btn=1){return `<div class="box"><h3>Order Summary</h3><div class="ln"><span>Subtotal</span><span>${pkr(sub())}</span></div><div class="ln"><span>Delivery</span><span>${dlv()?pkr(dlv()):"Complimentary"}</span></div><div class="ln tot"><span>Total</span><span>${pkr(sub()+dlv())}</span></div>${btn?`<a class="btn full" style="margin-top:18px;text-align:center" href="#checkout">Proceed to Checkout</a><p class="note">Free delivery above ${pkr(CFG.freeOver)}.</p>`:""}</div>`}
function chk(){if(!cart.length){location.hash="cart";return ""}
return `<div class="page wrap"><div class="sh"><h2>Checkout</h2></div><div class="cl"><div><label for="n">Full name</label><input id="n" autocomplete="name"><div class="err" id="e-n"></div><label for="m">Mobile number</label><input id="m" type="tel" inputmode="tel" placeholder="03XX XXXXXXX" autocomplete="tel"><div class="err" id="e-m"></div><label for="c">City</label><input id="c" autocomplete="address-level2"><div class="err" id="e-c"></div><label for="a">Complete delivery address</label><textarea id="a" rows="3" autocomplete="street-address"></textarea><div class="err" id="e-a"></div><label>Payment</label><div class="opt on" style="display:flex;align-items:center;padding:0 16px;width:100%;justify-content:flex-start">Cash on Delivery (COD)</div></div><div>${sum(0)}<button class="btn full" style="margin-top:14px" onclick="place()">Confirm Order</button><p class="note">Pay in cash when your order arrives. Prototype: confirming does not transmit or save the order.</p></div></div></div>`}
let last=null;
function place(){const v={n:$("#n").value.trim(),m:$("#m").value.replace(/[\s-]/g,""),c:$("#c").value.trim(),a:$("#a").value.trim()};let ok=1;
const E=(k,t)=>{$("#e-"+k).textContent=t;if(t)ok=0};E("n",v.n.length<3?"Enter your full name.":"");E("m",/^(03\d{9}|\+923\d{9})$/.test(v.m)?"":"Enter a valid mobile number, e.g. 0300 1234567.");E("c",v.c?"":"Enter your city.");E("a",v.a.length<10?"Enter your complete address.":"");if(!ok)return;
last={v,items:cart.map(i=>({n:i.p.name,o:i.o,q:i.q,t:i.p.price*i.q})),s:sub(),d:dlv(),no:"RV-"+Math.floor(100000+Math.random()*900000)};cart=[];upd();location.hash="done"}
function done(){if(!last)return "<div class='page wrap sh'><h2>No recent order</h2></div>";const o=last;const msg=encodeURIComponent(`New order ${o.no}\n${o.items.map(i=>`${i.q}× ${i.n} (${i.o}) – ${pkr(i.t)}`).join("\n")}\nTotal: ${pkr(o.s+o.d)} (COD)\n${o.v.n}, ${o.v.m}\n${o.v.c}, ${o.v.a}`);const num=CFG.whatsapp.replace(/\D/g,"");
return `<div class="page wrap ok"><div class="crumb">ORDER PREVIEW</div><h1>Thank you, ${o.v.n.split(" ")[0]}</h1><p>Reference ${o.no}. This is a prototype: your order was <b>not</b> saved or sent anywhere.</p><div class="box" style="text-align:left;margin:24px 0">${o.items.map(i=>`<div class="ln"><span>${i.q}× ${i.n}<br><small>${i.o}</small></span><span>${pkr(i.t)}</span></div>`).join("")}<div class="ln"><span>Delivery</span><span>${o.d?pkr(o.d):"Complimentary"}</span></div><div class="ln tot"><span>Total (COD)</span><span>${pkr(o.s+o.d)}</span></div><p class="note">${o.v.c} · ${o.v.a}<br>${o.v.m}</p></div>${num.length>=10?`<a class="btn" href="https://wa.me/${num}?text=${msg}" target="_blank" rel="noopener">Send order on WhatsApp</a>`:`<p class="note">Add your WhatsApp number in CFG to enable sending this order by WhatsApp.</p>`}<p style="margin-top:20px"><a href="#home" style="text-decoration:underline">Continue shopping</a></p></div>`}
const info=t=>`<div class="page wrap" style="max-width:720px"><div class="sh"><h2>${t}</h2></div>`;
function contact(){return info("Contact")+`<p>Questions about sizing, fabric or an order? Reach us:</p><p style="margin-top:14px">Phone / WhatsApp: ${CFG.phone}<br>Email: ${CFG.email}<br>${CFG.instaLabel}<br>Studio address: [PLACEHOLDER]</p></div>`}
function policy(){return info("Shipping & Exchange")+`<p><b>Shipping.</b> Delivery across Pakistan in [3–7] working days. Fee ${pkr(CFG.deliveryFee)}, free above ${pkr(CFG.freeOver)}.</p><p style="margin-top:14px"><b>Exchange.</b> Unworn, unwashed items with tags may be exchanged within [7] days. Unstitched fabric that has been cut cannot be exchanged.</p><p class="note">Placeholder wording. Replace with your real policy.</p></div>`}
function route(){const h=(location.hash||"#home").slice(1);let o;
if(h==="home")o=home();else if(COLS[h])o=coll(h);else if(h.startsWith("p-"))o=prod(h.slice(2));else if(h==="cart")o=cartv();else if(h==="checkout")o=chk();else if(h==="done")o=done();else if(h==="contact")o=contact();else if(h==="policy")o=policy();else o=home();
$("#app").innerHTML=o;document.querySelectorAll("nav.d a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h))}
let lastH="";addEventListener("hashchange",()=>{const h=location.hash;if(h!==lastH){gv=0;qty=1;filt="All";scrollTo(0,0)}lastH=h;menu(0);route()});
$("#nl").innerHTML=NAV.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join("");$("#ml").innerHTML=NAV.map(n=>`<a href="#${n[0]}" onclick="menu(0)">${n[1]}</a>`).join("");
$("#f1").textContent=CFG.phone;$("#f2").textContent=CFG.email;$("#f3").textContent="WhatsApp: "+CFG.whatsapp;$("#f4").textContent=CFG.instaLabel;$("#f4").href=CFG.insta;
document.querySelectorAll("img[data-logo]").forEach(i=>i.src=LOGO);
route();
</script></body></html>
